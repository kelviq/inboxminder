# Deploys site/ to the gh-pages branch root (inboxminder.com).
# keep_files preserves everything already on the branch, most importantly
# appcast.xml, which the release workflow owns (and which itself deploys
# with keep_files, so neither publisher clobbers the other).
name: Deploy site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: true
