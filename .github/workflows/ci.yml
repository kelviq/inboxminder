name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # macOS runner: the product targets macOS (Keychain, launchd) and the
    # native deps (better-sqlite3, keyring) must prove they build there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
